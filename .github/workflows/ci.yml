# HomeoClinic CI
#
# Task HC-MVP1-013/014/015 (M0 real pipeline). Lints, tests, audits and builds
# DEBUG Tauri artifacts for Linux and Windows on every push/PR to main, and
# runs the E2E suite on Linux (all specs) and on Windows (specs whose
# `@targets` header lists windows). Satisfies:
#   - R-DEL-001  : main is always releasable (Win + Linux artifacts build green)
#   - requirements/05 S6: "Build artifacts for Windows and Linux on every
#                          main-branch commit" (HC-MVP1-013)
#   - NFR-040 (Windows x64) / NFR-041 (Linux x64 AppImage + .deb, WebKitGTK 4.1)
#   - requirements/05 S6 lint gate, R-LINT-001..005 (HC-MVP1-014): clippy
#     -D warnings, fmt --check, eslint, prettier --check, tsc --noEmit strict.
#   - NFR-024 / R-SEC-008 dependency audit (HC-MVP1-015): committed lockfiles,
#     cargo audit + npm audit; a known vulnerable dependency fails CI.
#
# Constraints honoured:
#   - R-SEC-008: every action is pinned to a released tag.
#   - R-SEC-005: NO secrets are referenced. Code signing (Authenticode EV /
#                GPG; NFR-025, TAM-006) and the release scan (TAM-012) are the
#                release pipeline's job (hc-release-gate), not this workflow.
#   - Product rule 1: the APP makes no network calls; CI fetching deps is a
#                     build-host activity and does not change the app.
#
# The M0 workspace now exists (root Cargo.toml + Cargo.lock,
# apps/desktop/package.json + package-lock.json, the hc-* crates, src-tauri,
# React app), so every step below runs for real on every commit to main.

name: ci

on:
  push:
    branches: [main, staging-main]
  pull_request:
    branches: [main, staging-main]
  # Allow running the pipeline on demand from the Actions tab for any branch
  # (used for milestone-close Windows verification before promoting to main).
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# RUNNER IMAGE PINNING: every job runs on an EXACT image label, never
# ubuntu-latest / windows-latest. The `-latest` labels migrate gradually to a
# new OS (ubuntu-latest moving to Ubuntu 26.04 renamed the WebKit WebDriver
# package and broke the E2E job), so a pinned label means only an explicit edit
# here can move CI to a new OS. The labels below are the images the last green
# run used (run 41682950871, staging-main bbe9bd2, 2026-11-03), read from each
# job's "Runner Image" log group:
#   ubuntu jobs : Image: ubuntu-26.04         (Ubuntu 26.04.1 LTS, 20261025.179.1)
#   windows job : Image: windows-2025-vs2026  (Windows Server 2025 10.0.26100,
#                                               20261030.294.1)
# Both are documented YAML labels in actions/runner-images README. `runs-on`
# cannot read the workflow `env` context, so the labels are written literally
# in each job; change them together.

env:
  NODE_VERSION: "20"
  # Ubuntu Tauri 2 system deps (see docs/dev/environment.md section 2.1).
  # Same package names on the pinned ubuntu-26.04 image as on 24.04.
  LINUX_TAURI_DEPS: >-
    libwebkit2gtk-4.1-dev
    build-essential
    curl
    wget
    file
    libxdo-dev
    libssl-dev
    libayatana-appindicator3-dev
    librsvg2-dev

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }}

      # ---- Rust lint gate (R-LINT-001/002). Blocking. ----
      - name: Rust format check (R-LINT-002)
        run: cargo fmt --all -- --check

      - name: Rust clippy, deny warnings (R-LINT-001)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # ---- JS/TS gate (R-LINT-003/004/005). Blocking. ----
      - name: Install JS dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: TypeScript typecheck, strict (R-LINT-005)
        run: npm run typecheck
        working-directory: apps/desktop

      - name: ESLint (R-LINT-003)
        run: npm run lint
        working-directory: apps/desktop

      - name: Prettier format check (R-LINT-004)
        # The `format` script is the canonical name from
        # docs/rules/lint-policy.md (R-LINT-004); `-- --check` runs it in
        # check mode (prettier --check wins over --write) and fails on any
        # diff. Generated bindings.ts is excluded via .prettierignore.
        run: npm run format -- --check
        working-directory: apps/desktop

      - name: UI unit tests
        run: npm run test -- --run
        working-directory: apps/desktop

      # ---- Dependency audit (NFR-024 / R-SEC-008). Blocking. ----
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # Fails the build on any RUSTSEC *vulnerability* (a crate with a
        # patched version). Unmaintained/unsound advisories are reported as
        # warnings and do not fail the build.
        run: cargo audit

      - name: npm audit (production deps)
        # Fails on any HIGH or CRITICAL advisory in the production dependency
        # tree (NFR-024 done-when: a known vulnerable dependency fails CI).
        # --omit=dev scopes to shipped code; dev-only tooling advisories do
        # not gate release. Moderate/low advisories whose only fix is a
        # breaking major bump are reported but do not block main (R-DEL-001).
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/desktop

  build:
    name: Build debug artifacts
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        # Pinned images (see RUNNER IMAGE PINNING at the top).
        os: [ubuntu-26.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Ubuntu system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }}

      - name: Install JS dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build debug Tauri bundle
        # Debug build only. Release hardening + signing is hc-release-gate
        # (TAM-002/006, NFR-025), not this workflow. The cargo workspace is
        # rooted at the repo root, so the bundle lands in the WORKSPACE-ROOT
        # target/, not apps/desktop/src-tauri/target.
        run: npm run tauri build -- --debug
        working-directory: apps/desktop

      # Artifact paths follow the Tauri bundler layout (debug profile) under
      # the workspace-root target/ dir. Linux: AppImage + .deb; Windows: NSIS
      # -setup.exe + .msi (design/02 section 5, NFR-040/041).
      - name: Upload Linux artifacts (AppImage + .deb)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: homeoclinic-linux-x64-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            target/debug/bundle/appimage/*.AppImage
            target/debug/bundle/deb/*.deb

      - name: Upload Windows artifacts (NSIS .exe + .msi)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: homeoclinic-windows-x64-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            target/debug/bundle/nsis/*-setup.exe
            target/debug/bundle/msi/*.msi

  e2e-smoke:
    name: E2E smoke (R0, Linux)
    needs: build
    # Linux only: the WebdriverIO + tauri-driver harness targets WebKitWebDriver
    # under xvfb (hc-e2e-testing). It rebuilds the debug binary here so the E2E
    # job is self-contained; the build matrix artifacts are not downloaded.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Ubuntu system dependencies
        # On Ubuntu 26.04 (the pinned image) the WebKit WebDriver package is
        # webkitgtk-webdriver; older images call it webkit2gtk-driver. Keep
        # the fallback so a deliberate re-pin in either direction still
        # works. Install whichever name this image provides, then make sure the
        # WebKitWebDriver binary is on PATH (the harness resolves it with
        # `command -v WebKitWebDriver`).
        run: |
          sudo apt-get update
          if apt-cache show webkitgtk-webdriver >/dev/null 2>&1; then
            WEBDRIVER_PKG=webkitgtk-webdriver
          else
            WEBDRIVER_PKG=webkit2gtk-driver
          fi
          echo "Installing WebDriver package: $WEBDRIVER_PKG"
          # x11-utils (xwininfo, xprop), libxtst6 and gdb are used by the
          # real native file-picker smoke spec to find the GTK dialog window,
          # confirm it is a GtkFileChooserDialog and dismiss it.
          sudo apt-get install -y \
            ${{ env.LINUX_TAURI_DEPS }} \
            "$WEBDRIVER_PKG" \
            xvfb \
            x11-utils \
            libxtst6 \
            gdb
          # Let gdb attach to the app process it did not start (the smoke spec
          # reads the app's live GTK toplevels). Runner-only setting.
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          if ! command -v WebKitWebDriver >/dev/null 2>&1; then
            DRV="$(dpkg -L "$WEBDRIVER_PKG" | grep -E '/WebKitWebDriver$' | head -1)"
            if [ -z "$DRV" ]; then
              echo "::error::WebKitWebDriver not found in $WEBDRIVER_PKG"
              exit 1
            fi
            sudo ln -sf "$DRV" /usr/local/bin/WebKitWebDriver
          fi
          echo "WebKitWebDriver: $(command -v WebKitWebDriver)"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install JS dependencies (app)
        run: npm ci
        working-directory: apps/desktop

      - name: Build debug Tauri bundle
        # E2E-only: enable e2e-test-keys so the dev/test patient_import_fixture
        # command is compiled in (the R2 global-search spec seeds the fixture
        # through it). This throwaway E2E bundle is NOT a published artifact;
        # the release/installer build jobs never enable this feature.
        run: npm run tauri build -- --debug --features e2e-test-keys
        working-directory: apps/desktop

      - name: Build hc-seed binary (E2E fixture seeding)
        # The R2 global-search spec seeds the >=200 patient fixture by
        # invoking the hc-seed binary; build it so the spec is not
        # infra_incomplete. HC_SEED_BIN points the harness at it.
        run: cargo build -p hc-seed --bin hc-seed

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Run R0 walking-skeleton spec (headless)
        # wdio.conf.ts defaults to the workspace-root binary and
        # WebKitWebDriver on PATH; the env vars below are passed for
        # robustness (absolute native-driver path + explicit binary + a
        # writable data dir). xvfb provides a headless display.
        env:
          HC_E2E_OUTDIR: ${{ github.workspace }}/.e2e-out
        run: |
          mkdir -p "$HC_E2E_OUTDIR"
          HC_NATIVE_DRIVER="$(command -v WebKitWebDriver)" \
          HC_APP_BINARY="$GITHUB_WORKSPACE/target/debug/homeoclinic-desktop" \
          HC_SEED_BIN="$GITHUB_WORKSPACE/target/debug/hc-seed" \
          HC_DATA_DIR="$(mktemp -d)" \
          xvfb-run -a npx wdio run wdio.conf.ts
        working-directory: tests/e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeoclinic-e2e-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            .e2e-out/**

  e2e-smoke-windows:
    name: E2E smoke (Windows)
    needs: build
    # Same WebdriverIO + tauri-driver harness as the Linux job, but the native
    # driver is Microsoft Edge WebDriver (msedgedriver), which drives the
    # WebView2 runtime Tauri uses on Windows. No xvfb: the hosted Windows
    # runner has an interactive desktop session.
    #
    # SPEC SELECTION: HC_E2E_TARGET=windows makes wdio.conf.ts run only the
    # specs whose `// @targets` header lists `windows`. Linux-only specs (X11 /
    # GTK / xvfb / XDG_DATA_HOME dependent, e.g. real-picker-smoke and the
    # window-resize specs) are never started here.
    #
    # Self-contained like the Linux E2E job: it rebuilds the debug binary with
    # e2e-test-keys; the build matrix artifacts are not downloaded.
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Edge WebDriver matching the WebView2 runtime
        # msedgedriver must match the Chromium build of the webview it drives.
        # For a Tauri app that is the WebView2 Evergreen runtime (registry
        # value `pv` under its EdgeUpdate client GUID), which tracks Edge
        # stable but can differ by build; fall back to the installed Edge
        # version only if the WebView2 key is absent. The image's preinstalled
        # driver (EDGEWEBDRIVER) is reused only when its version is an exact
        # match; otherwise the exact matching build is fetched from
        # Microsoft's official Edge WebDriver endpoint. The result is checked
        # with `msedgedriver --version` and exported as HC_NATIVE_DRIVER (an
        # absolute path; tauri-driver rejects a bare name).
        run: |
          $ErrorActionPreference = 'Stop'
          $wv2Guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$wv2Guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$wv2Guid",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$wv2Guid"
          )
          $ver = $null
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $pv = (Get-ItemProperty -Path $k -Name pv -ErrorAction SilentlyContinue).pv
              if ($pv -and $pv -ne '0.0.0.0') { $ver = $pv; Write-Host "WebView2 runtime: $pv ($k)"; break }
            }
          }
          if (-not $ver) {
            $edgeExe = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edgeExe) { Write-Host '::error::Neither WebView2 runtime nor Edge found'; exit 1 }
            $ver = (Get-Item $edgeExe).VersionInfo.ProductVersion
            Write-Host "::warning::WebView2 registry key not found; using Edge $ver from $edgeExe"
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') { Write-Host "::error::Unexpected version '$ver'"; exit 1 }

          $drv = $null
          if ($env:EDGEWEBDRIVER) {
            $pre = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
            if ((Test-Path $pre) -and ((& $pre --version) -match [regex]::Escape($ver))) {
              $drv = $pre
              Write-Host "Reusing preinstalled msedgedriver $ver at $pre"
            }
          }
          if (-not $drv) {
            $dir = Join-Path $env:RUNNER_TEMP "msedgedriver-$ver"
            $zip = Join-Path $env:RUNNER_TEMP "edgedriver_win64-$ver.zip"
            $url = "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $drv = Join-Path $dir 'msedgedriver.exe'
          }
          $reported = & $drv --version
          Write-Host "msedgedriver: $reported"
          if ($reported -notmatch [regex]::Escape($ver)) {
            Write-Host "::error::msedgedriver '$reported' does not match webview $ver"
            exit 1
          }
          "HC_NATIVE_DRIVER=$drv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install JS dependencies (app)
        run: npm ci
        working-directory: apps/desktop

      - name: Build debug Tauri bundle
        # E2E-only e2e-test-keys build, exactly as the Linux E2E job. This
        # throwaway bundle is NOT a published artifact.
        run: npm run tauri build -- --debug --features e2e-test-keys
        working-directory: apps/desktop

      - name: Build hc-seed binary (E2E fixture seeding)
        run: cargo build -p hc-seed --bin hc-seed

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: List Windows-targeted specs
        # Informational + guard: shows which specs the @targets filter keeps
        # and fails early if none would run (a filter that selects nothing
        # must not pass green).
        run: |
          $sel = Get-ChildItem -Path specs -Recurse -Filter '*.e2e.ts' | Where-Object {
            $line = Select-String -Path $_.FullName -Pattern '^//\s*@targets\s+(.+)$' | Select-Object -First 1
            $line -and (($line.Matches[0].Groups[1].Value -split '[,\s]+') -contains 'windows')
          }
          if (-not $sel) { Write-Host '::error::No spec lists windows in @targets'; exit 1 }
          $sel | ForEach-Object { Write-Host "windows spec: $($_.FullName.Substring($PWD.Path.Length + 1))" }
        working-directory: tests/e2e

      - name: Run Windows-targeted specs
        # HC_E2E_TARGET=windows: wdio.conf.ts filters specs by @targets.
        # HC_NATIVE_DRIVER was exported by the Edge WebDriver step. Binaries
        # are the .exe paths in the workspace-root target dir.
        env:
          HC_E2E_TARGET: windows
          HC_E2E_OUTDIR: ${{ github.workspace }}\.e2e-out
          HC_APP_BINARY: ${{ github.workspace }}\target\debug\homeoclinic-desktop.exe
          HC_SEED_BIN: ${{ github.workspace }}\target\debug\hc-seed.exe
        run: |
          New-Item -ItemType Directory -Force -Path $env:HC_E2E_OUTDIR | Out-Null
          npx wdio run wdio.conf.ts
          exit $LASTEXITCODE
        working-directory: tests/e2e

      - name: Upload Windows E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeoclinic-e2e-report-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            .e2e-out/**

  perf-gate:
    name: NFR-002 performance gate (50k + 100k)
    needs: lint-and-test
    # HC-MVP1-057 / NFR-002 / NFR-007 (R-PERF-004): seed the synthetic dataset
    # at BOTH 50k and 100k with the real hc-seed generator and run the perf
    # harness (tests/perf) against each. The harness exits non-zero when any
    # NFR-002 p95 budget is missed, which fails this job and the build. The
    # heavy run is a release BINARY, not `cargo test`, so the lint-and-test
    # `cargo test --workspace` gate stays fast; this job runs it explicitly.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Ubuntu system dependencies
        # hc-perf depends on hc-app, which transitively pulls Tauri's
        # gtk/gdk/glib/gio -sys crates, so the full Tauri system deps are
        # required even for this non-bundling release build. (SQLCipher
        # bundled-sqlcipher-vendored-openssl also needs build-essential +
        # libssl-dev, which LINUX_TAURI_DEPS includes.)
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }}

      - name: Build perf harness (release profile, R-PERF-004)
        run: cargo build --release -p hc-perf

      # Deterministic seed so a run is reproducible; 300 iterations/op (>= the
      # 200-iteration procedure minimum) after discarded warm-ups. A missed
      # budget exits non-zero and FAILS the build (NFR-007 done-when).
      - name: Perf gate at 50k patients (NFR-002 + DB-size NFR-007)
        run: |
          ./target/release/hc-perf \
            --patients 50000 --seed 7 --iters 300 \
            --baseline-out "$RUNNER_TEMP/perf-50k.json"

      - name: Perf gate at 100k patients (NFR-002, must also pass)
        run: |
          ./target/release/hc-perf \
            --patients 100000 --seed 7 --iters 300 \
            --baseline-out "$RUNNER_TEMP/perf-100k.json"

      - name: Upload perf baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeoclinic-perf-baselines
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/perf-50k.json
            ${{ runner.temp }}/perf-100k.json
            tests/perf/baseline.json
