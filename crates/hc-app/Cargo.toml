[package]
name = "hc-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# DEV/E2E ONLY — never enabled in a release/public build. Gates test-only
# capabilities that must never ship: the E2E public licence key (hc-e2e-testing)
# and the `patient_import_fixture` command, which bulk-imports a SYNTHETIC
# plaintext JSONL fixture through the real patient_create path so the E2E
# orchestrator can seed the provisioned, boot-gated app (OPTION A, no key
# sharing). The production/release build never sets this feature, so the
# command is not compiled in and not registered (verified by the
# bindings-export surface). Named to match the documented E2E build:
# `tauri build --debug --features e2e-test-keys` (hc-e2e-testing SKILL).
e2e-test-keys = []

[dependencies]
hc-domain = { path = "../hc-domain" }
hc-storage = { path = "../hc-storage" }
hc-search = { path = "../hc-search" }
hc-repertory = { path = "../hc-repertory" }
hc-licence = { path = "../hc-licence" }
hc-docs = { path = "../hc-docs" }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
# Type-override marker (`Number`) for the i64 money fields so the default
# Typescript exporter emits `number` instead of rejecting BigInt-style ints.
# Paise amounts are always within JS safe-integer range (see setup/mod.rs),
# so `number` is lossless for this domain (R-DATA-004 kept as i64 in Rust).
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-specta = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
sha2 = { workspace = true }
# UUIDv7 ids for profile/trial rows (R-DATA-005); same pin as hc-storage.
uuid = { version = "1.28", features = ["v7"] }
# RFC3339 parse/format + 30-day trial math through the injected clock (LIC-063).
# Pinned to the version already resolved in the workspace lockfile.
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
specta-typescript = { workspace = true }
# Self-dependency-style: pull hc-storage's `testing` seam (temp_file_keystore,
# temp_db) into hc-app's integration tests without forcing the feature on for
# normal consumers (R-TEST-009).
hc-storage = { path = "../hc-storage", features = ["testing"] }
# Dev-only: exercise the REAL seed -> JSONL -> import -> search path in the
# fixture-import integration test. Tools depend on crates, so pulling the tool
# into hc-app's DEV deps does not invert the production graph (hc-app never
# depends on hc-seed in a release build).
hc-seed = { path = "../../tools/seed" }
tempfile = "3"

# The fixture-import integration test exercises the feature-gated command; a
# plain `cargo test -p hc-app` does not compile it in. Run it with
# `cargo test -p hc-app --features e2e-test-keys`.
