<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="790px" preserveAspectRatio="none" style="width:502px;height:790px;background:#FFFFFF;" version="1.1" viewBox="0 0 502 790" width="502px" zoomAndPan="magnify"><title>Tamper-proof release pipeline (TAM-001..012)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="315.3348" x="91.8801" y="34.9659">Tamper-proof release pipeline (TAM-001..012)</text><ellipse cx="282.1847" cy="60.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.8418" x="148.7638" y="90.0679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.8418" x="158.7638" y="112.896">Locked CI runner checks out tagged release</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.6773" x="180.8461" y="146.412"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.6773" x="190.8461" y="169.2401">Build frontend (minify + mangle)</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="303.178" x="130.5957" y="202.7561"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="283.178" x="140.5957" y="225.5842">Encrypt UI assets, embed in Rust binary (TAM-001)</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.9858" x="148.6918" y="259.1003"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.0976" x="158.6918" y="281.9283">Compile release: fat LTO, strip symbols,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.9858" x="158.6918" y="298.2725">no debug info, devtools removed (TAM-002)</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.3577" x="154.5059" y="331.7885"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.3577" x="164.5059" y="354.6166">Compile-time string encryption (TAM-003)</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="334.4142" x="114.9776" y="388.1326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="314.4142" x="124.9776" y="410.9607">Obfuscate hc-licence + pack-decrypt modules (TAM-008)</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="309.8141" x="127.2777" y="444.4767"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="289.8141" x="137.2777" y="467.3048">Hash code sections, sign manifest via hardware key</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104.6887" x="137.2777" y="483.6489">(MVP2: KMS/HSM),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.5131" x="137.2777" y="499.993">inject into binary (TAM-005)</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="290.5299" x="136.9198" y="533.5091"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.5299" x="146.9198" y="556.3371">Authenticode (EV) / GPG sign via HSM (TAM-006)</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="286.4859" x="138.9418" y="589.8532"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="266.4859" x="148.9418" y="612.6813">Build installers (NSIS/MSI, AppImage/deb), sign</text><polygon fill="#F1F1F1" points="174.611,646.1973,389.7585,646.1973,401.7585,668.6701,389.7585,691.143,174.611,691.143,162.611,668.6701,174.611,646.1973" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="108.6902" x="174.611" y="657.9562">Release scan passes?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="215.1475" x="174.611" y="672.9381">no symbols, no devtools, no plain secrets,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="191.8166" x="174.611" y="687.92">signatures valid, Defender + AV clean</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="145.5281" y="665.4471">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="401.7585" y="665.4471">no</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.2219" x="11" y="701.143"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.2219" x="21" y="723.971">Publish to update server + offline USB package</text><ellipse cx="152.611" cy="768.4871" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="152.611" cy="768.4871" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFC0CB" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158.673" x="332.422" y="701.143"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.673" x="342.422" y="723.971">Block release, alert team</text><ellipse cx="411.7585" cy="768.4871" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="411.7585" cy="768.4871" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="70.0679" y2="90.0679"/><polygon fill="#181818" points="278.1847,80.0679,282.1847,90.0679,286.1847,80.0679,282.1847,84.0679" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="126.412" y2="146.412"/><polygon fill="#181818" points="278.1847,136.412,282.1847,146.412,286.1847,136.412,282.1847,140.412" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="182.7561" y2="202.7561"/><polygon fill="#181818" points="278.1847,192.7561,282.1847,202.7561,286.1847,192.7561,282.1847,196.7561" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="239.1003" y2="259.1003"/><polygon fill="#181818" points="278.1847,249.1003,282.1847,259.1003,286.1847,249.1003,282.1847,253.1003" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="311.7885" y2="331.7885"/><polygon fill="#181818" points="278.1847,321.7885,282.1847,331.7885,286.1847,321.7885,282.1847,325.7885" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="368.1326" y2="388.1326"/><polygon fill="#181818" points="278.1847,378.1326,282.1847,388.1326,286.1847,378.1326,282.1847,382.1326" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="424.4767" y2="444.4767"/><polygon fill="#181818" points="278.1847,434.4767,282.1847,444.4767,286.1847,434.4767,282.1847,438.4767" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.1847" x2="282.1847" y1="513.5091" y2="533.5091"/><polygon fill="#181818" points="2