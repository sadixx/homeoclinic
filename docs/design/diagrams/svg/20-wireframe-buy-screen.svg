d cannot be changed later.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.1132" x="28" y="310.0254">I agree to store these details</text><rect fill="none" height="10" style="stroke:#000000;stroke-width:1.5;" width="10" x="10" y="300.3693"/><polygon fill="#000000" points="11,303.1973,14,306.1973,21,297.1973,14,304.1973" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="178.7172" x="524.8181" y="81.2401">3. Pay (scan with any UPI app)</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="68" x="527.3181" y="89.2561"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="41.6763" x="540.4799" y="104.0842">PAY QR</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.0095" x="524.8181" y="126.9283">Pay to: HomeoClinic (check this name)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.257" x="524.8181" y="145.2725">UPI ID: homeoclinic@bank</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="36" x="743.3276" y="134.9444"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.3442" x="747.1555" y="149.7725">Copy</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.6527" x="524.8181" y="172.6166">Amount: Rs 3,999</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="36" x="743.3276" y="162.2885"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.3442" x="747.1555" y="177.1166">Copy</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.2128" x="524.8181" y="199.9607">Note: HC-7K3P9 1Y</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="36" x="743.3276" y="189.6326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.3442" x="747.1555" y="204.4607">Copy</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="168.6012" x="785.8276" y="81.2401">4. Send payment screenshot</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="108" x="788.3276" y="89.2561"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.1246" x="800.7653" y="104.0842">WHATSAPP QR</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176.6413" x="785.8276" y="126.9283">Opens our WhatsApp with your</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.3728" x="785.8276" y="145.2725">details already typed.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.8291" x="785.8276" y="163.6166">Attach screenshot and send.</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="100" x="788.3276" y="171.6326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="81.8286" x="797.4133" y="186.4607">Copy message</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.1371" x="785.8276" y="209.3048">WhatsApp: +91 9XXXX XXXXX</text><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="522.8181" y1="66.412" y2="66.412"/><line style="stroke:#000000;stroke-width:1.0;" x1="522.8181" x2="783.8276" y1="315.5414" y2="315.5414"/><line style="stroke:#000000;stroke-width:1.0;" x1=